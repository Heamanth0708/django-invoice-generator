<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Invoice Generator</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        nav {
            background: #222;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }

        .btn {
            background: #222;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            display: inline-block;
            margin: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
        }

        th {
            background: #eee;
        }

        .messages {
            padding: 10px;
            background: #e7f5e7;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>

<nav>

    <a href="{% url 'dashboard' %}">
        Invoice Generator
    </a>

    {% if user.is_authenticated %}

        <a href="{% url 'create_invoice' %}">
            Create Invoice
        </a>

        <a href="{% url 'logout' %}">
            Logout
        </a>

    {% endif %}

</nav>


<div class="container">

    {% if messages %}

        {% for message in messages %}

            <div class="messages">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    {% block content %}

    {% endblock %}

</div>

</body>

</html>
