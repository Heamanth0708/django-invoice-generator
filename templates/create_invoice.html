{% extends "base.html" %}

{% block content %}

<h1>Create Invoice</h1>

<form method="POST">

{% csrf_token %}


<h2>Customer Details</h2>

<label>Customer Name</label>

<input
    type="text"
    name="customer_name"
    required
>


<label>Customer Email</label>

<input
    type="email"
    name="customer_email"
    required
>


<label>Customer Phone</label>

<input
    type="text"
    name="customer_phone"
    required
>


<label>Customer Address</label>

<textarea
    name="customer_address"
    required
></textarea>


<h2>Products</h2>

<table id="itemsTable">

<thead>

<tr>

    <th>Product</th>

    <th>Quantity</th>

    <th>Price</th>

    <th>Action</th>

</tr>

</thead>

<tbody>

<tr>

<td>

<input
    type="text"
    name="product_name"
    required
>

</td>

<td>

<input
    type="number"
    name="quantity"
    min="1"
    required
>

</td>

<td>

<input
    type="number"
    name="price"
    min="0"
    step="0.01"
    required
>

</td>

<td>

<button
    type="button"
    onclick="removeRow(this)"
>
Remove
</button>

</td>

</tr>

</tbody>

</table>


<br>

<button
    type="button"
    onclick="addRow()"
>
+ Add Product
</button>

<br><br>

<button type="submit">
    Generate Invoice
</button>

</form>


<script>

function addRow() {

    const table =
        document
        .getElementById("itemsTable")
        .getElementsByTagName("tbody")[0];

    const row = table.insertRow();

    row.innerHTML = `

        <td>
            <input
                type="text"
                name="product_name"
                required
            >
        </td>

        <td>
            <input
                type="number"
                name="quantity"
                min="1"
                required
            >
        </td>

        <td>
            <input
                type="number"
                name="price"
                min="0"
                step="0.01"
                required
            >
        </td>

        <td>
            <button
                type="button"
                onclick="removeRow(this)"
            >
                Remove
            </button>
        </td>

    `;
}


function removeRow(button) {

    const row = button.parentElement.parentElement;

    row.remove();

}

</script>

{% endblock %}
